name: Deploy site

# Builds the site from the committed data and publishes it to GitHub Pages. It never runs the
# scraper. A push made by the weekly job's own token does not trigger other workflows, so
# update.yml calls this one after it commits a new report.

on:
  push:
    branches: [main]
    paths: ['site/**', 'data/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}  # the branch head, so a run called after the weekly commit publishes that commit
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build site from committed data
        working-directory: site
        run: |
          npm ci
          # The share card shows this week's numbers, so it is drawn here, not committed.
          python -m pip install pillow==12.2.0
          python og-card.py
          npm run build
          # Older iPhones (Safari < 16.4) ignore media-query range syntax, which silently turns off
          # the responsive layout. vite.config.js pins targets to prevent it; this proves it.
          if grep -qE '@media[^{]*(width|height)[<>]' dist/assets/*.css; then
            echo "Built CSS contains media-query range syntax; check build.cssTarget in vite.config.js" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v5
