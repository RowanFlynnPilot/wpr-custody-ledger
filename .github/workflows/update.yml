name: Weekly update

on:
  schedule:
    # 14:00 UTC. DOC posts each Friday's report by Friday afternoon, so Saturday usually picks it up;
    # Monday and Wednesday catch a late posting (holiday weeks) and any correction to a recent week.
    - cron: '0 14 * * 1,3,6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # the weekly brief is delivered as an issue

concurrency:
  group: weekly-update
  cancel-in-progress: false

# Up to five attempts, each on a FRESH runner: the state network drops connections from some
# runner addresses (see doc-attempt.yml). A blocked attempt ends green with reached=false and the
# next one takes over; the attempt that gets through does the whole job.
jobs:
  attempt-1:
    uses: ./.github/workflows/doc-attempt.yml
    with: { pipeline: weekly, attempt: 1 }
  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.reached == 'false'
    uses: ./.github/workflows/doc-attempt.yml
    with: { pipeline: weekly, attempt: 2 }
  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.reached == 'false'
    uses: ./.github/workflows/doc-attempt.yml
    with: { pipeline: weekly, attempt: 3 }
  attempt-4:
    needs: attempt-3
    if: needs.attempt-3.outputs.reached == 'false'
    uses: ./.github/workflows/doc-attempt.yml
    with: { pipeline: weekly, attempt: 4 }
  attempt-5:
    needs: attempt-4
    if: needs.attempt-4.outputs.reached == 'false'
    uses: ./.github/workflows/doc-attempt.yml
    with: { pipeline: weekly, attempt: 5 }

  # Five blocked runners in a row is not bad luck any more: fail, so the run is noticed.
  blocked:
    needs: attempt-5
    if: needs.attempt-5.outputs.reached == 'false'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error title=No runner could reach doc.wi.gov::All five attempts were blocked by the state network. Nothing was updated."
          exit 1

  # Publish the site with the new report. deploy.yml checks out the branch head, which now has it.
  deploy:
    needs: [attempt-1, attempt-2, attempt-3, attempt-4, attempt-5]
    if: ${{ !cancelled() && contains(needs.*.outputs.changed, 'true') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
