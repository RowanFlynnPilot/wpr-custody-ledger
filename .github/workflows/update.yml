name: Weekly update

on:
  schedule:
    # 14:00 UTC. DOC posts each Friday's report by Friday afternoon, so Saturday usually picks it up;
    # Monday and Wednesday catch a late posting (holiday weeks) and any correction to a recent week.
    - cron: '0 14 * * 1,3,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # Node 24 majors: GitHub removed Node 20 from Actions runners on Sep 16, 2026.
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scraper/update.py
      - run: python scraper/build.py
      - name: Commit new data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Weekly DOC-302 update"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Publish the site with the new report. deploy.yml checks out the branch head, which now has it.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
