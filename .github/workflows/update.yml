name: Weekly update

on:
  schedule:
    - cron: '0 14 * * 6'  # Saturdays 14:00 UTC; DOC posts each Friday's report by Friday afternoon
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Node 24 majors: GitHub removed Node 20 from Actions runners on Sep 16, 2026.
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scraper/update.py
      - run: python scraper/build.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Weekly DOC-302 update"
            git push
          fi
