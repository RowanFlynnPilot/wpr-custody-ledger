name: Monthly county counts

# DOC posts a person-level file about 15 days after each month ends. This job downloads any month
# not yet stored, keeps only county counts (nothing under 10), and publishes. The file itself is
# held in memory and never written to the repository. It runs twice a week so a late posting is
# picked up within days; most runs find nothing new and change nothing.

on:
  schedule:
    - cron: '0 15 * * 2,5'  # Tuesdays and Fridays, 15:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-update  # shared with update.yml: both commit to data/, so they never run at once
  cancel-in-progress: false

# Up to five attempts, each on a FRESH runner: the state network drops connections from some
# runner addresses (see doc-attempt.yml).
jobs:
  attempt-1:
    uses: ./.github/workflows/doc-attempt.yml
    with: { pipeline: counties, attempt: 1 }
  attempt-2:
    needs: attempt-1
    if: needs.attempt-1.outputs.reached == 'false'
    uses: ./.github/workflows/doc-attempt.yml
    with: { pipeline: counties, attempt: 2 }
  attempt-3:
    needs: attempt-2
    if: needs.attempt-2.outputs.reached == 'false'
    uses: ./.github/workflows/doc-attempt.yml
    with: { pipeline: counties, attempt: 3 }
  attempt-4:
    needs: attempt-3
    if: needs.attempt-3.outputs.reached == 'false'
    uses: ./.github/workflows/doc-attempt.yml
    with: { pipeline: counties, attempt: 4 }
  attempt-5:
    needs: attempt-4
    if: needs.attempt-4.outputs.reached == 'false'
    uses: ./.github/workflows/doc-attempt.yml
    with: { pipeline: counties, attempt: 5 }

  blocked:
    needs: attempt-5
    if: needs.attempt-5.outputs.reached == 'false'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error title=No runner could reach doc.wi.gov::All five attempts were blocked by the state network. Nothing was updated."
          exit 1

  deploy:
    needs: [attempt-1, attempt-2, attempt-3, attempt-4, attempt-5]
    if: ${{ !cancelled() && contains(needs.*.outputs.changed, 'true') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
